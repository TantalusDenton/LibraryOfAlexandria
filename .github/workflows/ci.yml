name: Studio checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: alexandria, POSTGRES_DB: alexandria, POSTGRES_PASSWORD: ci-only}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U alexandria" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.10.11", python-version: "3.12", enable-cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: bash scripts/install.sh
      - name: Azure deployment configuration
        run: backend/.venv/bin/ruff check deploy/azure && backend/.venv/bin/python -m unittest discover -s deploy/azure -p 'test_*.py' -v
      - run: .venv/bin/ruff check app tests alembic && .venv/bin/python -m pytest -q && .venv/bin/alembic check
        working-directory: backend
      - run: .venv/bin/alembic upgrade head && .venv/bin/python -m tests.runtime_validation
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://alexandria:ci-only@127.0.0.1/alexandria
          CHECKPOINT_URL: postgresql://alexandria:ci-only@127.0.0.1/alexandria
          REDIS_URL: redis://127.0.0.1:6379/0
          VALIDATE_DISPOSABLE_RUNTIME: "1"
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser acceptance
        run: |
          bash scripts/dev.sh > /tmp/alexandria-services.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null && curl -sf http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-diagnostics, path: "frontend/test-results/"}

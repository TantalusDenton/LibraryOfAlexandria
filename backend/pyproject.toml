[project]
name = "alexandria-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "openai>=2,<3", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4", "redis>=5,<7", "rq>=2,<3",
  "boto3>=1.35,<2", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5",
  "charset-normalizer>=3,<4", "Pillow>=11,<13", "reportlab>=4.3,<5",
  "pymupdf>=1.25,<2", "python-multipart>=0.0.20,<1", "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "tenacity>=9,<10", "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13", "azure-storage-queue>=12.12,<13"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*builtin type.*:DeprecationWarning"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
